services:
  postgres:
    image: postgres:16-alpine
    container_name: memoire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoire
      POSTGRES_PASSWORD: memoire
      POSTGRES_DB: memoire
    ports:
      # Host port 5432 is taken by a native PostgreSQL (Laragon) on this
      # machine, so Memoire's container is published on 5433 instead.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoire -d memoire"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: memoire-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: memoire
      MINIO_ROOT_PASSWORD: memoire123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
